version: "2"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    govet:
      enable:
        - fieldalignment
    errcheck:
      # Ignore error checks in test files for common test helpers
      exclude-functions:
        - (io.Closer).Close
        - (*encoding/json.Encoder).Encode
        - (io.Writer).Write
  exclusions:
    paths:
      - vendor
    # Exclude some linters from running on test files
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
  tests: true
